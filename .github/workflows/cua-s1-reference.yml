name: Cua-S1 reference recipe
on:
  pull_request:
    paths:
      - 'recipe/cua_s1/**'
      - 'tests/cua_s1/test_export_multimodal_reference.py'
      - 'src/models/cua_s1/multimodal/**'
      - '.github/workflows/cua-s1-reference.yml'
  push:
    branches: [main]
    paths:
      - 'recipe/cua_s1/**'
      - 'tests/cua_s1/test_export_multimodal_reference.py'
      - 'src/models/cua_s1/multimodal/**'
      - '.github/workflows/cua-s1-reference.yml'
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install Pillow==11.3.0 numpy==2.5.3 safetensors==0.8.0 pytest==9.1.1 ruff==0.16.8
      - run: PYTHONPATH=src python -m pytest tests/cua_s1/test_export_multimodal_reference.py -q
      - run: ruff check --isolated --select E4,E7,E9,F,I recipe/cua_s1/export_multimodal_reference.py recipe/cua_s1/verify_multimodal_reference.py tests/cua_s1/test_export_multimodal_reference.py
      - run: ruff format --isolated --check recipe/cua_s1/export_multimodal_reference.py recipe/cua_s1/verify_multimodal_reference.py tests/cua_s1/test_export_multimodal_reference.py
