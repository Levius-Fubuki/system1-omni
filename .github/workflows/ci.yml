name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - name: Frontend API tests
        run: cargo test -p omni-jev --test frontend --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --workspace --release --locked

  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r benchmarks/requirements.txt
      - run: python benchmarks/bench.py validate benchmarks/smoke.jsonl
      - run: python -m unittest discover -s tests/benchmarks -p 'test_*.py' -v

  cuda-contract:
    # The CUDA backend contract and its checker. No CUDA toolkit and no GPU: both
    # read files as text. This depends on #25 for check_contract.py, and it
    # arrives with the qwen3_5 manifest below because the checker exits 1 on a
    # tree that has kernels and no declaration for them.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Contract checker tests
        run: python -m unittest discover -s src/backends/cuda/tests -t . -v
      - name: Kernel tests
        # Each backend keeps its tests beside its kernels, so this discovers per
        # directory rather than assuming one tests/ tree. `-t` has to point at the
        # directory itself: the kernel dirs are not packages and are not
        # importable from the repository root.
        run: |
          for dir in src/backends/cuda/*/; do
            if compgen -G "${dir}test_*.py" > /dev/null; then
              echo "== $dir"
              python -m unittest discover -s "$dir" -t "$dir" -v
            fi
          done
      - name: Contract check
        run: |
          if [ ! -f src/backends/cuda/check_contract.py ]; then
            echo "::error::src/backends/cuda/check_contract.py is missing. It lands in #25, which this step depends on; merge that first."
            exit 1
          fi
          python src/backends/cuda/check_contract.py --repo-root .
