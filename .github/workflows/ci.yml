name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - name: Frontend API tests
        run: cargo test -p omni-jev --test frontend --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --workspace --release --locked

  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r benchmarks/requirements.txt
      - run: python benchmarks/bench.py validate benchmarks/smoke.jsonl
      - run: python -m unittest discover -s tests/benchmarks -p 'test_*.py' -v

  cuda-contract:
    # The CUDA backend contract and its checker. No CUDA toolkit and no GPU: both
    # read files as text.
    #
    # The checker and its tests arrive in #25, so on a tree without them there is
    # nothing to run. That is a skip, not a failure: this job has to be green on
    # the branch that carries it before #25 lands, and it has to start running by
    # itself once #25 does, in either merge order. Failing instead would redden
    # whichever PR arrived second.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check for the checker
        id: present
        run: |
          if [ -f src/backends/cuda/check_contract.py ] && [ -d src/backends/cuda/tests ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::src/backends/cuda/check_contract.py and src/backends/cuda/tests are not in this tree; they arrive in #25. Skipping."
          fi
      - name: Contract checker tests
        if: steps.present.outputs.ready == 'true'
        run: python -m unittest discover -s src/backends/cuda/tests -t . -v
      - name: Kernel tests
        if: steps.present.outputs.ready == 'true'
        # Each backend keeps its tests beside its kernels. `-t` has to point at
        # the directory itself: kernel directories are not packages, so `-t .`
        # fails with "Start directory is not importable".
        run: |
          for dir in src/backends/cuda/*/; do
            if compgen -G "${dir}test_*.py" > /dev/null; then
              echo "== $dir"
              python -m unittest discover -s "$dir" -t "$dir" -v
            fi
          done
      - name: Contract check
        if: steps.present.outputs.ready == 'true'
        run: python src/backends/cuda/check_contract.py --repo-root .
