name: Cua-S1 multimodal CPU checks
on:
  pull_request:
    paths:
      - 'src/models/cua_s1/multimodal/**'
      - 'tests/cua_s1/**'
      - 'recipe/cua_s1/**'
      - '.github/workflows/cua-s1-multimodal.yml'
  push:
    branches: [main]
    paths:
      - 'src/models/cua_s1/multimodal/**'
      - 'tests/cua_s1/**'
      - 'recipe/cua_s1/**'
      - '.github/workflows/cua-s1-multimodal.yml'
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0 pytest==9.1.1 ruff==0.16.8
      - run: PYTHONPATH=src python -m pytest tests/cua_s1 -q
      - run: ruff check --isolated --select E4,E7,E9,F,I src/models/cua_s1/multimodal tests/cua_s1 recipe/cua_s1
      - run: ruff format --isolated --check src/models/cua_s1/multimodal tests/cua_s1 recipe/cua_s1
